

worker_processes 1;

error_log  logs/error.log  error;

pid        logs/nginx.pid;

events {
	worker_connections 1024;
}


http {
	include mime.types;

	default_type application/octet-stream;

	server_names_hash_bucket_size 512;
	client_header_buffer_size 32k;
	large_client_header_buffers 4 32k;
	client_max_body_size 100m;

	sendfile on;
	tcp_nopush on;

	keepalive_timeout 1200;

	tcp_nodelay on;

	gzip on;
	gzip_min_length 1k;
	gzip_buffers 4 16k;
	gzip_http_version 1.1;
	gzip_comp_level 2;
	gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json image/jpeg image/gif image/png font/ttf font/otf image/svg+xml application/xml+rss text/x-js;
	gzip_vary on;
	gzip_proxied expired no-cache no-store private auth;
	gzip_disable "MSIE [1-6]\.";

	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_conn_zone $server_name zone=perserver:10m;

	server_tokens off;
	access_log off;

	server {
		include common-settings.conf;
		listen 40443;
		server_name $ohr_server_name;

		location /engine/ {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			alias $engine_root_directory;
			autoindex off;
		}

		location /help/ {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			alias $help_root_directory;
			autoindex off;
		}

		include api-proxy.conf;

		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header Pragma "no-cache";
			add_header Expires 0;
			root $portal_root_directory;
			try_files $uri $uri/ /index.html;
			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location = /hr/ {
			rewrite /hr/ /hr/index.html;
		}

		location = /set/ {
			rewrite /set/ /set/index.html;
		}

		location = /nencho/ {
			rewrite /nencho/ /nencho/index.html;
		}

		location = /workflow/ {
			rewrite /workflow/ /workflow/index.html;
		}

		location = /hr/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header Pragma "no-cache";
			add_header Expires 0;
			expires off;
			root $web_root_directory;
			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location = /set/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header Pragma "no-cache";
			add_header Expires 0;
			expires off;
			root $web_root_directory;
			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location = /nencho/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header Pragma "no-cache";
			add_header Expires 0;
			expires off;
			root $web_root_directory;
			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location = /workflow/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
			add_header Pragma "no-cache";
			add_header Expires 0;
			expires off;
			root $web_root_directory;
			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location /hr/ {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			root $web_root_directory;
			try_files $uri $uri/ =404;

			# Enable CORS
			add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';

			# Optional: Allow credentials
			add_header 'Access-Control-Allow-Credentials' 'true';

			# Handle preflight requests
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
				add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
				add_header 'Access-Control-Allow-Credentials' 'true';
				add_header 'Content-Length' '0';
				add_header 'Content-Type' 'text/plain charset=UTF-8';
				return 204;
			}

			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location /nencho/ {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			root $web_root_directory;
			try_files $uri $uri/ =404;

			# Enable CORS
			add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';

			# Optional: Allow credentials
			add_header 'Access-Control-Allow-Credentials' 'true';

			# Handle preflight requests
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
				add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
				add_header 'Access-Control-Allow-Credentials' 'true';
				add_header 'Content-Length' '0';
				add_header 'Content-Type' 'text/plain charset=UTF-8';
				return 204;
			}

			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location /set/ {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			root $web_root_directory;
			try_files $uri $uri/ =404;

			# Enable CORS
			add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';

			# Optional: Allow credentials
			add_header 'Access-Control-Allow-Credentials' 'true';

			# Handle preflight requests
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
				add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
				add_header 'Access-Control-Allow-Credentials' 'true';
				add_header 'Content-Length' '0';
				add_header 'Content-Type' 'text/plain charset=UTF-8';
				return 204;
			}

			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location /workflow/ {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			root $web_root_directory;
			try_files $uri $uri/ =404;

			# Enable CORS
			add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
			add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';

			# Optional: Allow credentials
			add_header 'Access-Control-Allow-Credentials' 'true';

			# Handle preflight requests
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' $ohr_portal_origin;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
				add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
				add_header 'Access-Control-Allow-Credentials' 'true';
				add_header 'Content-Length' '0';
				add_header 'Content-Type' 'text/plain charset=UTF-8';
				return 204;
			}

			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}

		location / {
			add_header Cache-Control "no-cache";
			add_header Pragma "no-cache";
			expires off;
			root $portal_root_directory;
			try_files $uri $uri/ /index.html;
			index index.html index.htm;
			proxy_set_header Connection "";
			proxy_http_version 1.1;
			proxy_read_timeout 300;
		}
	}
}
