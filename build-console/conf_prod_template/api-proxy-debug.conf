set $proxy_target "";

location ^~ /proxy/ {
  # Lua code to redirect requests based on http header
  rewrite_by_lua_block {
    local set_proxy = require("resty.set_proxy_target")
    set_proxy.execute({
      default_gateway_address = "http://localhost:3198/"
    })
  }

  # Lua code to capture request info and forward to Vector
  access_by_lua_block {
    local send_vector = require("resty.send_to_vector")
    send_vector.execute({
      server = "undefined",
      timeout = 200
    })
  }

  # Remove the /proxy/ prefix from the URI
  rewrite ^/proxy/(.*) /$1 break;

  proxy_pass $proxy_target;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header REMOTE-HOST $remote_addr;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header x-campus-cd $http_x_campus_cd;
	proxy_http_version 1.1;
	# proxy_hide_header Upgrade;

	add_header X-Cache $upstream_cache_status;
	#Set Nginx Cache

	set $static_filePc1z1oRd 0;
	if ( $uri ~* "\.(gif|png|jpg|css|js|woff|woff2)$" ) {
		set $static_filePc1z1oRd 1;
		expires 1m;
	}
	if ( $static_filePc1z1oRd = 0 ) {
		add_header Cache-Control no-cache;
	}

	proxy_read_timeout 30m;
	proxy_send_timeout 30m;
	proxy_connect_timeout 300s;
	error_page 502 =502 /error-502.json;
	error_page 503 =503 /error-503.json;
	error_page 504 =504 /error-504.json;
}

location = /error-502.json {
    internal;
    default_type application/json;
    return 200 '{"fromNginx":true,"statusCode":502,"message":"Bad Gateway: The upstream server returned an invalid response"}';
}

location = /error-503.json {
    internal;
    default_type application/json;
    return 200 '{"fromNginx":true,"statusCode":503,"message":"Service Unavailable: The upstream server is currently unable to handle the request"}';
}

location = /error-504.json {
    internal;
    default_type application/json;
    return 200 '{"fromNginx":true,"statusCode":504,"message":"Gateway Timeout: The upstream server did not respond in time"}';
}
